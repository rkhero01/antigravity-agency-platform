version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/antigravity_agency?schema=public
      - JWT_SECRET=production-grade-jwt-secret-min-32-chars-key-2026!
      - WEBHOOK_SECRET=production-grade-webhook-secret-key-2026!
      - CORS_ORIGIN=http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: antigravity_agency
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antigravity_agency"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
